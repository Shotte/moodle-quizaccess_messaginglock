name: Feature request
description: Suggest an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The plugin deliberately has very few settings. Please describe the problem you want to solve, not only the solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you need to achieve, and why is it not possible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
